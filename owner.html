/* =========================================================
   LOAD DATABASE
========================================================= */

function loadDatabase() {

  try {

    const saved = localStorage.getItem(STORAGE_KEY);

    if (saved) {
      return JSON.parse(saved);
    }

  } catch (error) {
    console.warn("Database local gagal dibaca.", error);
  }

  return JSON.parse(JSON.stringify(defaultDatabase));
}


const dbData = loadDatabase();


/* =========================================================
   GLOBAL STATE
========================================================= */

const state = {

  currentUser: null,

  products: dbData.products || [],

  salesList: dbData.salesList || [],

  stores: dbData.stores || [],

  visits: dbData.visits || [],

  transactions: dbData.transactions || [],

  deposits: dbData.deposits || [],

  fuelRecords: dbData.fuelRecords || [],

  auditLogs: dbData.auditLogs || [],

  currentView: "login",

  activeSalesTab: "dashboard",

  activeOwnerTab: "dashboard",

  activeCheckInStore: null

};


/* =========================================================
   SAVE DATABASE
========================================================= */

function saveDatabase() {

  try {

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify({
        products: state.products,
        salesList: state.salesList,
        stores: state.stores,
        visits: state.visits,
        transactions: state.transactions,
        deposits: state.deposits,
        fuelRecords: state.fuelRecords,
        auditLogs: state.auditLogs
      })
    );

  } catch (error) {

    console.error("Gagal menyimpan database:", error);

  }

}


/* =========================================================
   SYNC ANTAR TAB
========================================================= */

window.addEventListener("storage", function(event) {

  if (event.key !== STORAGE_KEY) return;

  try {

    const data = JSON.parse(event.newValue);

    if (!data) return;

    state.products = data.products || [];
    state.salesList = data.salesList || [];
    state.stores = data.stores || [];
    state.visits = data.visits || [];
    state.transactions = data.transactions || [];
    state.deposits = data.deposits || [];
    state.fuelRecords = data.fuelRecords || [];
    state.auditLogs = data.auditLogs || [];

    refreshCurrentScreen();

    showToast(
      "Data CRISFISH diperbarui dari tab lain.",
      "success"
    );

  } catch (error) {
    console.error(error);
  }

});


/* =========================================================
   UTILITIES
========================================================= */

function todayString() {

  return new Date().toISOString().slice(0, 10);

}


function calculateDaysDifference(dateString) {

  if (!dateString) return 999;

  const visitDate = new Date(dateString);

  const today = new Date("2026-08-26");

  const diff =
    Math.abs(today - visitDate) /
    (1000 * 60 * 60 * 24);

  return Math.ceil(diff);

}


function formatRupiah(number) {

  return new Intl.NumberFormat(
    "id-ID",
    {
      style: "currency",
      currency: "IDR",
      maximumFractionDigits: 0
    }
  ).format(Number(number) || 0);

}


function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================================================
   TOAST
========================================================= */

function showToast(message, type = "info") {

  const container =
    document.getElementById("toast-container");

  const toast =
    document.createElement("div");

  const bg =
    type === "success"
      ? "bg-emerald-600"
      : type === "error"
      ? "bg-rose-600"
      : type === "warning"
      ? "bg-amber-500"
      : "bg-slate-800";

  toast.className =
    `${bg} text-white px-4 py-3 rounded-xl shadow-xl
     flex items-center space-x-2 text-sm
     pointer-events-auto`;

  toast.innerHTML = `
    <i class="fa-solid ${
      type === "success"
        ? "fa-check-circle"
        : type === "error"
        ? "fa-triangle-exclamation"
        : "fa-circle-info"
    }"></i>

    <span>${escapeHTML(message)}</span>
  `;

  container.appendChild(toast);

  setTimeout(() => {
    toast.remove();
  }, 3500);

}


/* =========================================================
   MODAL
========================================================= */

window.openModal = function(title, htmlContent) {

  document.getElementById("modal-title").innerText = title;

  document.getElementById("modal-body").innerHTML =
    htmlContent;

  const backdrop =
    document.getElementById("modal-backdrop");

  const card =
    document.getElementById("modal-card");

  backdrop.classList.remove("hidden");
  backdrop.classList.add("flex");

  card.classList.add("modal-enter");

};


window.closeModal = function() {

  const backdrop =
    document.getElementById("modal-backdrop");

  backdrop.classList.add("hidden");
  backdrop.classList.remove("flex");

  document.getElementById("modal-body").innerHTML = "";

};


/* =========================================================
   AUDIT
========================================================= */

function logAudit(actor, action, details) {

  state.auditLogs.unshift({

    id: "log_" + Date.now(),

    timestamp:
      new Date()
        .toISOString()
        .replace("T", " ")
        .substring(0, 19),

    actor,

    action,

    details

  });

}


/* =========================================================
   REFRESH SCREEN
========================================================= */

function refreshCurrentScreen() {

  if (!state.currentUser) {

    renderLogin();

    return;

  }

  if (state.currentUser.role === "OWNER") {

    renderOwnerApp();

  } else {

    const currentSales =
      state.salesList.find(
        s => s.id === state.currentUser.id
      );

    if (currentSales) {

      state.currentUser = currentSales;

      renderSalesApp();

    } else {

      logout();

    }

  }

}


/* =========================================================

========================================================= */

window.handleLogin = function(event) {

  event.preventDefault();

  const role =
    document.getElementById("login-role").value;

  const username =
    document.getElementById("login-username")
      .value
      .trim();

  const password =
    document.getElementById("login-password")
      .value
      .trim();


  if (role === "OWNER") {

    if (
      username === "owner" &&
      password === "owner123"
    ) {

      state.currentUser = {

        id: "owner_1",

        name: "Pak Boss (Owner)",

        username: "owner",

        role: "OWNER",

        email: "owner@crisfish.com"

      };

      logAudit(
        "OWNER",
        "Login Success",
        "Owner login."
      );

      saveDatabase();

      showToast(
        "Login Owner berhasil!",
        "success"
      );

      renderOwnerApp();

    } else {

      showToast(
        "Username atau password Owner salah.",
        "error"
      );

    }

    return;

  }


  const sales =
    state.salesList.find(
      s =>
        (
          s.username === username ||
          s.email === username
        ) &&
        s.status === "AKTIF"
    );


  if (
    sales &&
    password === (sales.password || "sales123")
  ) {

    state.currentUser = sales;

    logAudit(
      sales.name,
      "Login Success",
      "Sales login."
    );

    saveDatabase();

    showToast(
      `Selamat bekerja, ${sales.name}!`,
      "success"
    );

    renderSalesApp();

  } else {

    showToast(
      "Sales tidak ditemukan atau password salah.",
      "error"
    );

  }

};


window.logout = function() {

  if (state.currentUser) {

    logAudit(
      state.currentUser.name,
      "Logout",
      "User keluar dari sistem."
    );

    saveDatabase();

  }

  state.currentUser = null;

  renderLogin();

};

/* =========================================================
   SALES DASHBOARD
========================================================= */

function renderSalesContent() {

  const main =
    document.getElementById("main-content");

  const user =
    state.salesList.find(
      s => s.id === state.currentUser.id
    );


  if (!user) {

    logout();

    return;

  }


  state.currentUser = user;


  const userStores =
    state.stores
      .filter(s => s.salesId === user.id);


  userStores.forEach(store => {

    store.daysSinceLastVisit =
      calculateDaysDifference(
        store.lastVisitDate
      );

    if (store.daysSinceLastVisit >= 14) {

      store.status = "PRIORITAS";

    } else if (
      store.daysSinceLastVisit >= 11
    ) {

      store.status = "PERLU DIKUNJUNGI";

    } else {

      store.status = "AKTIF";

    }

  });


  if (state.activeSalesTab === "dashboard") {

    renderSalesDashboard(
      main,
      user,
      userStores
    );

  } else if (
    state.activeSalesTab === "ai-assistant"
  ) {

    renderAISalesAssistant();

  } else if (
    state.activeSalesTab === "route"
  ) {

    renderSalesRoute();

  } else if (
    state.activeSalesTab === "stores"
  ) {

    renderSalesStores();

  } else if (
    state.activeSalesTab === "deposit"
  ) {

    renderSalesDeposit();

  }

}

window.generateGeminiSalesAdvice =
async function() {

  const container =
    document.getElementById(
      "ai-response-container"
    );

  if (!container) return;

  container.innerHTML = `

    <div class="text-center py-10">

      <i class="fa-solid fa-spinner
                fa-spin text-3xl
                text-brand-600"></i>

      <p class="text-xs mt-3">
        AI sedang menganalisis toko...
      </p>

    </div>

  `;


  if (!apiKey) {

    container.innerHTML = `

      <div class="bg-amber-50
                  border border-amber-200
                  rounded-2xl p-5 text-xs">

        <b>AI Gemini belum diaktifkan.</b>

        <p class="mt-2">
          Masukkan Gemini API Key pada
          variabel <b>apiKey</b>.
        </p>

        <hr class="my-3">

        <b>Analisis lokal sementara:</b>

        <ul class="list-disc ml-5 mt-2">

          ${
            state.stores
              .filter(
                s =>
                  s.salesId ===
                  state.currentUser.id
              )
              .sort(
                (a,b) =>
                  b.daysSinceLastVisit -
                  a.daysSinceLastVisit
              )
              .slice(0,3)
              .map(
                s => `
                  <li>
                    ${escapeHTML(s.name)}
                    —
                    ${s.daysSinceLastVisit}
                    hari belum dikunjungi,
                    stok ${s.stock} pack.
                  </li>
                `
              )
              .join("")
          }

        </ul>

      </div>

    `;

    return;

  }


  try {

    const stores =
      state.stores.filter(
        s =>
          s.salesId ===
          state.currentUser.id
      );


    const prompt = `
Anda adalah AI Sales Advisor CRISFISH.

Sales:
${state.currentUser.name}

Area:
${state.currentUser.area}

Data toko:
${JSON.stringify(stores)}

Tentukan tiga toko paling prioritas
untuk dikunjungi hari ini.

Pertimbangkan:
1. Sudah berapa hari tidak dikunjungi.
2. Stok toko.
3. Rata-rata penjualan.
4. Potensi omzet.

Berikan rekomendasi praktis dalam bahasa Indonesia.
`;


    const response =
      await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            contents: [
              {
                parts: [
                  {
                    text: prompt
                  }
                ]
              }
            ]
          })
        }
      );


    const data =
      await response.json();


    const text =
      data.candidates?.[0]
        ?.content?.parts?.[0]?.text
      || "AI tidak memberikan jawaban.";


    container.innerHTML = `

      <div class="bg-amber-50
                  border border-amber-200
                  rounded-2xl p-5
                  text-sm leading-relaxed">

        ${text}

      </div>

    `;

  } catch(error) {

    console.error(error);

    showToast(
      "AI gagal dihubungi.",
      "warning"
    );

    renderAISalesAssistant();

  }

};

window.submitCheckOutForm =
function() {

  const store =
    state.activeCheckInStore;

  if (!store) return;


  const initialStock =
    Number(
      document.getElementById(
        "visit-initial-stock"
      ).value
    ) || 0;


  const finalStock =
    Number(
      document.getElementById(
        "visit-final-stock"
      ).value
    ) || 0;


  const returnQty =
    Number(
      document.getElementById(
        "visit-return-qty"
      ).value
    ) || 0;


  const notes =
    document.getElementById(
      "visit-notes"
    ).value.trim();


  let totalSold = 0;

  let totalAmount = 0;


  document
    .querySelectorAll(".visit-qty-input")
    .forEach(input => {

      const qty =
        Number(input.value) || 0;

      if (qty <= 0) return;


      const productId =
        input.dataset.prodid;


      const product =
        state.products.find(
          p => p.id === productId
        );


      if (!product) return;


      if (qty > product.stock) {

        showToast(
          `Stok ${product.name} tidak cukup.`,
          "error"
        );

        return;

      }


      const amount =
        qty * product.price;


      totalSold += qty;

      totalAmount += amount;


      /*
        STOK GUDANG DIKURANGI.
      */

      product.stock -= qty;


      state.transactions.unshift({

        id:
          "trx_" +
          Date.now() +
          "_" +
          productId,

        date: "2026-08-26",

        salesId:
          state.currentUser.id,

        salesName:
          state.currentUser.name,

        storeId:
          store.id,

        storeName:
          store.name,

        productId,

        qty,

        unitPrice:
          product.price,

        totalAmount:
          amount,

        paymentStatus:
          "LUNAS",

        paymentMethod:
          "CASH"

      });

    });


  /*
    UPDATE TOKO
  */

  store.stock =
    finalStock;

  store.totalSales =
    Number(store.totalSales || 0) +
    totalSold;

  store.lastVisitDate =
    "2026-08-26";

  store.daysSinceLastVisit =
    0;

  store.status =
    "AKTIF";

  if (notes) {
    store.notes = notes;
  }


  /*
    SIMPAN RIWAYAT
  */

  state.visits.unshift({

    id:
      "visit_" + Date.now(),

    storeId:
      store.id,

    salesId:
      state.currentUser.id,

    storeName:
      store.name,

    date:
      "2026-08-26",

    checkIn:
      "09:00",

    checkOut:
      "09:15",

    durationMinutes:
      15,

    initialStock,

    soldCount:
      totalSold,

    addedCount:
      totalSold,

    returnCount:
      returnQty,

    deposit:
      totalAmount,

    notes,

    gps:
      `${store.lat},${store.lng}`

  });


  logAudit(
    state.currentUser.name,
    "Check-Out Visit",
    `Toko ${store.name}, terjual ${totalSold} pack, omzet ${formatRupiah(totalAmount)}`
  );


  saveDatabase();

  closeModal();

  showToast(
    "Kunjungan berhasil disimpan.",
    "success"
  );

  renderSalesContent();

};

window.submitDepositForm =
function() {

  const user =
    state.currentUser;


  const trx =
    state.transactions.filter(
      t =>
        t.salesId === user.id &&
        t.date === "2026-08-26"
    );


  const gross =
    trx.reduce(
      (sum,t) =>
        sum + t.totalAmount,
      0
    );


  const deposited =
    Number(
      document.getElementById(
        "deposit-amount"
      ).value
    ) || 0;


  const discrepancy =
    gross - deposited;


  state.deposits.unshift({

    id:
      "dep_" + Date.now(),

    date:
      "2026-08-26",

    salesId:
      user.id,

    salesName:
      user.name,

    grossSales:
      gross,

    collectedCash:
      gross,

    depositedCash:
      deposited,

    discrepancy,

    status:
      discrepancy === 0
        ? "VERIFIED"
        : "SELISIH"

  });


  logAudit(
    user.name,
    "Submit Deposit",
    `Setoran ${formatRupiah(deposited)}`
  );


  saveDatabase();

  showToast(
    discrepancy === 0
      ? "Setoran terverifikasi."
      : "Setoran memiliki selisih.",
    discrepancy === 0
      ? "success"
      : "warning"
  );

};

window.saveNewProduct =
function() {

  const sku =
    document.getElementById(
      "product-sku"
    ).value.trim();


  const name =
    document.getElementById(
      "product-name"
    ).value.trim();


  const price =
    Number(
      document.getElementById(
        "product-price"
      ).value
    ) || 0;


  const hpp =
    Number(
      document.getElementById(
        "product-hpp"
      ).value
    ) || 0;


  const stock =
    Number(
      document.getElementById(
        "product-stock"
      ).value
    ) || 0;


  const status =
    document.getElementById(
      "product-status"
    ).value;


  if (!sku || !name) {

    showToast(
      "SKU dan nama produk wajib diisi.",
      "error"
    );

    return;

  }


  const product = {

    id:
      "prod_" + Date.now(),

    sku,

    name,

    price,

    hpp,

    stock,

    status

  };


  state.products.push(product);


  logAudit(
    "OWNER",
    "Add Product",
    `Produk ${name} ditambahkan. Stok ${stock}.`
  );


  saveDatabase();

  closeModal();

  showToast(
    "Produk berhasil ditambahkan.",
    "success"
  );

  renderOwnerSubView();

};

window.saveProductEdit =
function(productId) {

  const product =
    state.products.find(
      p => p.id === productId
    );

  if (!product) return;


  const oldStock =
    product.stock;


  product.sku =
    document.getElementById(
      "edit-product-sku"
    ).value.trim();


  product.name =
    document.getElementById(
      "edit-product-name"
    ).value.trim();


  product.price =
    Number(
      document.getElementById(
        "edit-product-price"
      ).value
    ) || 0;


  product.hpp =
    Number(
      document.getElementById(
        "edit-product-hpp"
      ).value
    ) || 0;


  product.stock =
    Number(
      document.getElementById(
        "edit-product-stock"
      ).value
    ) || 0;


  product.status =
    document.getElementById(
      "edit-product-status"
    ).value;


  logAudit(
    "OWNER",
    "Edit Product",
    `${product.name}: stok ${oldStock} → ${product.stock}`
  );


  saveDatabase();

  closeModal();

  showToast(
    "Produk berhasil diperbarui.",
    "success"
  );


  /*
    Jika Owner dan Sales membuka aplikasi
    dalam TAB yang sama browser,
    event storage akan membuat tampilan
    Sales ikut berubah.

    Pada tab Owner sendiri kita render ulang.
  */

  renderOwnerSubView();

};


window.deleteProduct =
function(productId) {

  const product =
    state.products.find(
      p => p.id === productId
    );

  if (!product) return;


  const used =
    state.transactions.some(
      t => t.productId === productId
    );


  if (used) {

    product.status =
      "NONAKTIF";

    saveDatabase();

    showToast(
      "Produk pernah dipakai transaksi. Produk dinonaktifkan, bukan dihapus.",
      "warning"
    );

    renderOwnerSubView();

    return;

  }


  if (
    !confirm(
      `Hapus produk ${product.name}?`
    )
  ) return;


  state.products =
    state.products.filter(
      p => p.id !== productId
    );


  logAudit(
    "OWNER",
    "Delete Product",
    `Produk ${product.name} dihapus.`
  );


  saveDatabase();

  showToast(
    "Produk dihapus.",
    "success"
  );

  renderOwnerSubView();

};

    address:
      document.getElementById(

    lng:

function renderOwnerFinancials(panel) {

  const omzet =
    state.transactions.reduce(
      (sum,t) =>
        sum + t.totalAmount,
      0
    );


  const hpp =
    state.transactions.reduce(
      (sum,t) => {

        const product =
          state.products.find(
            p => p.id === t.productId
          );

        return sum +
          (
            product
              ? product.hpp * t.qty
              : 0
          );

      },
      0
    );


  const gross =
    omzet - hpp;


  const fuel =
    state.fuelRecords.reduce(
      (sum,f) =>
        sum + f.amount,
      0
    );


  const commission =
    state.transactions.reduce(
      (sum,t) => {

        const sales =
          state.salesList.find(
            s => s.id === t.salesId
          );

        return sum +
          t.qty *
          (
            sales
              ? sales.commissionRate
              : 500
          );

      },
      0
    );


  const net =
    gross -
    fuel -
    commission;


  panel.innerHTML = `

    <div class="bg-white
                rounded-3xl
                border
                shadow-sm
                p-6">

      <h2 class="text-xl font-bold">

        Laporan Keuangan

      </h2>

      <p class="text-xs
                text-slate-500 mb-6">

        Perhitungan otomatis dari transaksi.

      </p>


      <div class="space-y-3
                  max-w-xl">

        <div class="flex
                    justify-between
                    p-4
                    bg-slate-50
                    rounded-xl">

          <span>
            Omzet
          </span>

          <b>
            ${formatRupiah(omzet)}
          </b>

        </div>


        <div class="flex
                    justify-between
                    p-4
                    bg-slate-50
                    rounded-xl">

          <span>
            HPP
          </span>

          <b class="text-rose-600">

            - ${formatRupiah(hpp)}

          </b>

        </div>


        <div class="flex
                    justify-between
                    p-4
                    bg-emerald-50
                    rounded-xl
                    font-bold">

          <span>
            LABA KOTOR
          </span>

          <span>
            ${formatRupiah(gross)}
          </span>

        </div>


        <div class="flex
                    justify-between
                    p-4
                    bg-slate-50
                    rounded-xl">

          <span>
            Bensin
          </span>

          <b class="text-rose-600">

            - ${formatRupiah(fuel)}

          </b>

        </div>


        <div class="flex
                    justify-between
                    p-4
                    bg-slate-50
                    rounded-xl">

          <span>
            Komisi Sales
          </span>

          <b class="text-rose-600">

            - ${formatRupiah(
              commission
            )}

          </b>

        </div>


        <div class="flex
                    justify-between
                    p-5
                    bg-slate-900
                    text-white
                    rounded-2xl
                    font-bold">

          <span>
            LABA OPERASIONAL
          </span>

          <span class="text-amber-400">

            ${formatRupiah(net)}

          </span>

        </div>

      </div>

    </div>

  `;

}

window.generateGeminiOwnerAdvice =
async function() {

  const container =
    document.getElementById(
      "owner-ai-container"
    );


  if (!apiKey) {

    container.innerHTML = `

      <div class="bg-amber-50
                  border border-amber-200
                  rounded-2xl
                  p-5 text-xs">

        Gemini API belum diaktifkan.

        <br><br>

        Tetapi berdasarkan data lokal:

        <ul class="list-disc ml-5 mt-2">

          <li>
            Fokuskan kunjungan pada toko
            ≥14 hari.
          </li>

          <li>
            Pantau produk dengan stok rendah.
          </li>

          <li>
            Evaluasi sales berdasarkan
            omzet, pack, komisi dan bensin.
          </li>

        </ul>

      </div>

    `;

    return;

  }


  container.innerHTML = `

    <div class="text-center py-8">

      <i class="fa-solid
                fa-spinner
                fa-spin
                text-3xl
                text-brand-600"></i>

      <p class="text-xs mt-2">
        AI sedang menganalisis bisnis...
      </p>

    </div>

  `;


  try {

    const prompt = `
Anda adalah konsultan bisnis CRISFISH.

Analisis data:
Sales: ${JSON.stringify(state.salesList)}
Produk: ${JSON.stringify(state.products)}
Toko: ${JSON.stringify(state.stores)}
Transaksi: ${JSON.stringify(state.transactions)}

Berikan 5 rekomendasi bisnis yang praktis
untuk meningkatkan omzet, profit,
produktivitas sales dan kunjungan toko.
Gunakan bahasa Indonesia.
`;


    const response =
      await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            contents: [
              {
                parts: [
                  {
                    text: prompt
                  }
                ]
              }
            ]
          })
        }
      );


    const data =
      await response.json();


    const answer =
      data.candidates?.[0]
        ?.content?.parts?.[0]?.text
      || "Tidak ada hasil.";


    container.innerHTML = `

      <div class="bg-amber-50
                  border border-amber-200
                  rounded-2xl
                  p-5 text-sm
                  leading-relaxed">

        ${answer}

      </div>

    `;

  } catch(error) {

    console.error(error);

    showToast(
      "AI gagal dihubungi.",
      "warning"
    );

  }

};

window.exportReportToCSV =
function() {

  let csv =
    "Tanggal,Sales,Toko,Produk,Qty,Harga,Total\n";


  state.transactions.forEach(
    transaction => {

      const product =
        state.products.find(
          p =>
            p.id ===
            transaction.productId
        );


      csv +=
        `"${transaction.date}",` +
        `"${transaction.salesName}",` +
        `"${transaction.storeName}",` +
        `"${product
          ? product.name
          : transaction.productId}",` +
        `${transaction.qty},` +
        `${transaction.unitPrice},` +
        `${transaction.totalAmount}\n`;

    }
  );


  const blob =
    new Blob(
      [csv],
      {
        type:
          "text/csv;charset=utf-8;"
      }
    );


  const url =
    URL.createObjectURL(blob);


  const a =
    document.createElement("a");


  a.href = url;

  a.download =
    "Laporan_CRISFISH.csv";

  a.click();


  URL.revokeObjectURL(url);

};
