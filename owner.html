/* =========================
   STATISTIK
========================= */

function days(d){

if(!d)return 999;

return Math.floor(
(Date.now()-
new Date(d+'T00:00:00').getTime())
/86400000
);

}


function stats(){

const tx=
arr('transactions')
.filter(x=>
(x.date||'').startsWith(month())
);

const sales=
arr('sales')
.filter(x=>
x.status!=='NONAKTIF'
);

const omzet=
tx.reduce(
(a,x)=>a+(+x.totalAmount||0),
0
);

const qty=
tx.reduce(
(a,x)=>a+(+x.qty||0),
0
);

const hpp=
tx.reduce(
(a,x)=>
a+
(+x.qty||0)*
(+state.data.products?.[x.productId]?.hpp||0),
0
);

const fuel=
arr('fuelRecords')
.filter(x=>
String(x.date||'').startsWith(month())
)
.reduce(
(a,x)=>a+(+x.amount||0),
0
);

const comm=
tx.reduce(
(a,x)=>
a+
(+x.qty||0)*
(+state.data.sales?.[x.salesId]?.commissionRate||0),
0
);

return{

omzet,

qty,

gross:
omzet-hpp,

net:
omzet-hpp-fuel-comm,

sales:sales.length,

stores:
arr('stores').length,

overdue:
arr('stores')
.filter(s=>days(s.lastVisitDate)>=14)
.length

};

}

`Anda adalah konsultan bisnis canvassing CRISFISH/Petekres.

window.saveNewSales=async()=>{

try{

const email=
$('s_email').value.trim();

const password=
$('s_password').value.trim();

if(!email||
password.length<6)
throw Error(
'Email dan password minimal 6 karakter wajib.'
);


const creatorApp=
initializeApp(
firebaseConfig,
'salesCreator'
);

const ca=
getAuth(creatorApp);

const cred=
await createUserWithEmailAndPassword(
ca,
email,
password
);

const uid=
cred.user.uid;

await signOut(ca);


const id=
'sales_'+uid.slice(0,8);


const profile={

uid,

code:
$('s_code').value.trim(),

name:
$('s_name').value.trim(),

email,

area:
$('s_area').value.trim(),

dailyTarget:
+$('s_daily').value||0,

monthlyTarget:
+$('s_monthly').value||0,

baseSalary:
+$('s_salary').value||0,

commissionRate:
+$('s_comm').value||0,

fuelAllowance:
+$('s_fuel').value||0,

status:'AKTIF'

};


await update(
ref(db),
{

['users/'+uid]:{

role:'sales',

salesId:id,

name:profile.name,

email

},

['sales/'+id]:profile

}
);


await log(
'Add Sales',
'Sales '+profile.name+' dibuat'
);

closeModal();

toast(
'Akun sales berhasil dibuat.'
);

}catch(e){

console.error(e);

toast(
'Gagal: '+e.message
);

}

};

/* =========================
   BOOT OWNER
========================= */

async function boot(u){

state.user=u;


/* CEK UID OWNER */

if(u.uid!==OWNER_UID){

const userSnap=
await new Promise((resolve,reject)=>{

onValue(
ref(db,'users/'+u.uid),
s=>resolve(s),
reject,
{onlyOnce:true}
);

});


if(userSnap.val()?.role!=='owner'){

await signOut(auth);

showLoginMsg(
'Akun ini bukan akun Owner.'
);

return;

}

}


await seed();


$('login').classList.add('hiddenx');

$('app').classList.remove('hiddenx');

subscribe();

}


onAuthStateChanged(
auth,
u=>{

if(u){

boot(u);

}else{

$('login').classList.remove('hiddenx');

$('app').classList.add('hiddenx');

}

}

);

</script>
